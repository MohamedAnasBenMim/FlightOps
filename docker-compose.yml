services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flightops}
      POSTGRES_USER: ${POSTGRES_USER:-flightops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flightops_local_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flightops} -d ${POSTGRES_DB:-flightops}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-flightops}:${POSTGRES_PASSWORD:-flightops_local_only}@db:5432/${POSTGRES_DB:-flightops}
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:18080"]'
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-18000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
