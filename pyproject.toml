[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "flightops"
version = "0.1.0"
description = "Weather-aware drone mission planning platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["flightops*"]