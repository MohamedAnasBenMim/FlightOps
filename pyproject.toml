[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "flightops"
version = "0.2.0"
description = "Weather-aware drone mission planning platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.16.5",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "pydantic-settings==2.11.0",
    "psycopg[binary]==3.2.10",
    "sqlalchemy==2.0.43",
    "starlette==1.2.1",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "cfn-lint==1.57.0",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-cov==7.0.0",
    "respx==0.22.0",
    "ruff==0.16.9",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["flightops*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
markers = ["integration: requires a PostgreSQL test database"]
